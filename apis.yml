name: Zibra AI
description: Zibra AI is a Ukrainian deep-tech company building AI-powered real-time
  volumetric rendering and compression technology for VFX, gaming, virtual production,
  film, and TV. Its flagship product, ZibraVDB, compresses OpenVDB volumetric datasets
  to roughly five percent of their original size while preserving visual quality,
  enabling real-time playback of smoke, fire, fog, and other volumetric effects. Zibra
  ships a native C++ ZibraVDB SDK (DirectX 12, Vulkan, and Metal on Windows, Linux,
  and macOS) alongside plugins for Unreal Engine, Houdini, and Unity, with Blender
  support in progress. It exposes no public REST/HTTP API; integration is through the
  SDK and digital-content-creation plugins. Surfaced as an a16z portfolio company and
  added to the API Evangelist network.
